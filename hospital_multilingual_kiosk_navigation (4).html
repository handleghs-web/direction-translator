<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병원 다국어 길안내 시스템 (Smart Hospital Navigation System)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    /* 2000x1200 (실사용 2000x1100) 태블릿 맞춤 노스크롤 컨테이너 */
    .kiosk-viewport {
      height: 100vh;
      max-height: 1100px;
      display: flex;
      flex-col;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Pulsing animation for mic recording */
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.03); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-active {
      animation: pulse-ring 1.8s infinite;
    }
    
    /* Directional pulse animation for navigation */
    @keyframes arrow-bounce-left {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-20px); }
    }
    @keyframes arrow-bounce-right {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(20px); }
    }
    @keyframes arrow-bounce-up {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .anim-left { animation: arrow-bounce-left 1.2s infinite ease-in-out; }
    .anim-right { animation: arrow-bounce-right 1.2s infinite ease-in-out; }
    .anim-up { animation: arrow-bounce-up 1.2s infinite ease-in-out; }

    /* Custom scrollbar for multi-language horizontal bar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden select-none">

  <!-- TOP HEADER & LANGUAGE SELECTOR BAR -->
  <header class="bg-slate-900 border-b border-slate-800 shadow-xl sticky top-0 z-50">
      <div>
        <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-2">
          스마트 병원 길안내 <span class="text-[10px] bg-blue-600/30 text-blue-400 border border-blue-500/40 px-2 py-0.5 rounded-full font-semibold">AI Kiosk</span>
        </h1>
        <p id="subHeaderTitle" class="text-xs text-slate-400 font-medium">다국어 음성 인식 & 바닥 선 경로 안내 시스템</p>
      </div>
    </div>

    <!-- Language Selector Buttons Grid/Row -->
    <div class="flex items-center space-x-3">
      <div id="langSelectorContainer" class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar">
        <!-- Language buttons rendered dynamically via JS -->
      </div>

      <!-- Hidden Admin Modal Trigger Button -->
      <button onclick="toggleAdminModal()" class="w-9 h-9 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center border border-slate-700">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
    </div>
  </header>


  <!-- MAIN CONTAINER (VIEW SWAPPER) - Fits inside 1100px height without vertical scroll -->
  <main class="flex-grow px-6 py-4 flex flex-col justify-center overflow-hidden">

    <!-- ==================== 1. MAIN SCREEN (HOME) ==================== -->
    <div id="mainScreen" class="h-full flex flex-col justify-between max-w-6xl mx-auto w-full py-2">

      <!-- Hero Header & Instructions -->
      <div class="text-center space-y-1 shrink-0">
        <div class="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-xs font-bold text-teal-400 shadow-inner">
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
          <span id="welcomeBadge">음성 인식 및 터치 안내 서비스</span>
        </div>
        <h2 id="mainInstruction" class="text-3xl font-black text-white tracking-tight">
          원하시는 장소를 눌러주세요
        </h2>
        <p id="voiceInstructionSub" class="text-slate-400 text-sm">
          아래 검사실 버튼을 누르시거나, 음성 마이크 버튼을 누르고 말씀하세요.
        </p>
      </div>

      <!-- VOICE SPEECH MIC BUTTON SECTION -->
      <div class="max-w-md mx-auto text-center w-full my-2 shrink-0">
        <button id="micBtn" onclick="toggleSpeechRecognition()" 
                class="w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-extrabold text-lg shadow-xl shadow-blue-900/30 hover:scale-[1.01] active:scale-95 transition-all border border-blue-400/30 flex items-center justify-center space-x-3">
          <div id="micIconBg" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-lg">
            <i class="fa-solid fa-microphone"></i>
          </div>
          <span id="micBtnText" class="drop-shadow-md">🎤 원하시는 장소를 말씀해 주세요</span>
        </button>
        
        <!-- Live Speech Status Display -->
        <div id="speechStatusBox" class="mt-1.5 text-xs text-slate-400 h-5 flex items-center justify-center">
          <span id="speechStatusText">버튼을 누르고 "엑스레이실", "채혈실", "화장실" 등을 말해보세요.</span>
        </div>
      </div>

      <!-- DESTINATION BUTTONS GRID (5 LOCATIONS) -->
      <div class="grid grid-cols-6 gap-4 w-full my-auto">

        <!-- 1. 엑스레이실 (Orange Line - Left) -->
        <button onclick="selectDestination('xray')" 
                class="col-span-2 group relative bg-slate-900/90 hover:bg-slate-800 border-2 border-amber-500/40 hover:border-amber-500 p-5 rounded-2xl text-left transition-all shadow-lg hover:shadow-amber-500/10 flex flex-col justify-between h-36">
          <div class="flex items-start justify-between">
            <div class="w-11 h-11 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-xl">
              <i class="fa-solid fa-x-ray"></i>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
              <span class="w-2 h-2 rounded-full bg-amber-400 inline-block mr-1"></span>
              <span class="dest-line-label">주황색 선</span>
            </span>
          </div>
          <div>
            <div class="text-[10px] text-amber-400/80 font-bold uppercase">X-RAY ROOM</div>
            <h3 class="text-xl font-black text-white dest-name-xray">엑스레이실</h3>
            <p class="text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">
              <i class="fa-solid fa-arrow-left text-amber-400"></i>
              <span class="dest-dir-hint">왼쪽</span>
            </p>
          </div>
        </button>

        <!-- 2. 채혈실 (Lime Green Line - Right) -->
        <button onclick="selectDestination('blood')" 
                class="col-span-2 group relative bg-slate-900/90 hover:bg-slate-800 border-2 border-lime-500/40 hover:border-lime-500 p-5 rounded-2xl text-left transition-all shadow-lg hover:shadow-lime-500/10 flex flex-col justify-between h-36">

            <div class="w-11 h-11 rounded-xl bg-lime-500/20 text-lime-400 border border-lime-500/30 flex items-center justify-center text-xl">

            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-lime-500/20 text-lime-300 border border-lime-500/30">
              <span class="w-2 h-2 rounded-full bg-lime-400 inline-block mr-1"></span>
              <span class="dest-line-label">연두색 선</span>
            </span>
          </div>
          <div>
            <div class="text-[10px] text-lime-400/80 font-bold uppercase">BLOOD TEST ROOM</div>
            <h3 class="text-xl font-black text-white dest-name-blood">채혈실</h3>
            <p class="text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">

            </p>

        <!-- 3. 화장실 (Yellow Line - Straight) -->

            <div class="w-11 h-11 rounded-xl bg-yellow-400/20 text-yellow-300 border border-yellow-400/30 flex items-center justify-center text-xl">

            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-yellow-400/20 text-yellow-300 border border-yellow-400/30">
              <span class="w-2 h-2 rounded-full bg-yellow-300 inline-block mr-1"></span>
              <span class="dest-line-label">노란색 선</span>
            </span>
          </div>
          <div>
            <div class="text-[10px] text-yellow-300/80 font-bold uppercase">RESTROOM</div>
            <h3 class="text-xl font-black text-white dest-name-toilet">화장실</h3>

              <span class="dest-dir-hint">직진</span>
            </p>
          </div>
        </button>

        <!-- 4. MRI실 (Blue Line - Left) -->
        <button onclick="selectDestination('mri')" 
                class="col-span-3 group relative bg-slate-900/90 hover:bg-slate-800 border-2 border-blue-500/40 hover:border-blue-500 p-5 rounded-2xl text-left transition-all shadow-lg hover:shadow-blue-500/10 flex flex-col justify-between h-36">

            <div class="w-11 h-11 rounded-xl bg-blue-500/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-xl">
              <i class="fa-solid fa-magnet"></i>
            </div>

              <span class="dest-dir-hint">왼쪽</span>

    <!-- ==================== 2. NAVIGATION RESULT SCREEN (COMPACT & BACK BUTTON VISIBLE) ==================== -->
    <div id="navScreen" class="hidden h-full flex flex-col justify-between max-w-4xl mx-auto w-full py-2">

        <!-- Top Badge Info -->
        <div class="flex items-center justify-between gap-3 shrink-0">
          <div class="flex items-center space-x-3">
            <div id="navIconContainer" class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl font-extrabold text-white">
              <!-- Dynamic Icon -->
            </div>
            <div>
              <span id="navLineTag" class="px-2.5 py-0.5 rounded-full text-[11px] font-black uppercase tracking-wider">
                <!-- Color Tag -->
              </span>
              <h2 id="navDestTitle" class="text-2xl font-black text-white mt-0.5">
                <!-- Destination Name -->
              </h2>
            </div>
          </div>

          <!-- Replay Audio Button -->
          <button onclick="speakCurrentGuide()" 
                  class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30 px-3.5 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">
            <i class="fa-solid fa-volume-high text-teal-400"></i>
            <span id="btnReplayText">다시 듣기</span>
          </button>
        </div>

        <!-- GIANT DIRECTION ARROW & VISUAL INDICATOR -->
        <div class="my-4 py-4 bg-slate-950/80 rounded-2xl border border-slate-800 flex flex-col items-center justify-center shadow-inner my-auto">
          <!-- Animated Big Arrow -->
          <div id="navArrowBox" class="text-7xl mb-2 filter drop-shadow-lg">
            ⬅️
          </div>

          <!-- Floor Line Indicator Simulation Box -->
          <div class="w-full max-w-md px-6">
            <div class="text-[11px] text-center text-slate-400 mb-1 font-medium flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-shoe-prints"></i>
              <span id="floorLineFollowInstruction">바닥의 안내선을 따라 이동하세요</span>
            </div>
            <!-- Simulated Floor Line Graphic -->
            <div id="floorLineBar" class="h-4 w-full rounded-full shadow-lg transition-all duration-300"></div>
          </div>
        </div>

        <!-- DUAL LANGUAGE TEXT GUIDANCE BOX -->
        <div class="space-y-4 text-center sm:text-left bg-slate-800/60 border border-slate-700/50 p-6 rounded-2xl">
          <!-- Native Target Language Text (Large) -->
          <div class="space-y-1">
            <div class="text-xs font-extrabold text-teal-400 tracking-wider uppercase" id="targetLangLabel">SELECTED LANGUAGE GUIDE</div>
            <div id="navTargetGuide" class="text-2xl sm:text-3xl font-extrabold text-yellow-300 leading-snug">
              <!-- Selected Language TTS Text -->
            </div>
          </div>

          <hr class="border-slate-700/80 my-3">

          <!-- Korean Language Text (For Staff / Reference) -->
          <div class="space-y-1">
            <div class="text-xs font-bold text-slate-400 tracking-wider uppercase">한국어 안내 (Korean Guide)</div>
            <div id="navKoreanGuide" class="text-lg sm:text-xl font-bold text-slate-200">
              <!-- Korean Text -->
            </div>
          </div>
        </div>

      </div>

      <!-- BOTTOM BACK BUTTON -->
      <div class="text-center pt-2 pb-6">
        <button onclick="goToHome()" 
                class="w-full sm:w-auto px-10 py-5 rounded-3xl bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 text-white font-extrabold text-xl shadow-xl hover:shadow-slate-700/20 active:scale-95 transition-all flex items-center justify-center space-x-3 mx-auto">
          <i class="fa-solid fa-rotate-left text-teal-400"></i>
          <span id="btnBackText">처음으로 (Back to Home)</span>
        </button>
      </div>

    </div>

  </main>

    /* ==========================================================================
       2. STATE MANAGEMENT & INITIALIZATION
       ========================================================================== */
    
    let currentLang = 'ko-KR'; // Default Korean
    let currentActiveDest = null;
    let recognition = null;
    let isListening = false;

    // Window Onload Lifecycle Hook
    window.onload = function() {
      renderLanguageSelector();
      updateLanguageUI();
      initSpeechRecognition();
    };

    /* Render Language Selection Pills Header */
    function renderLanguageSelector() {
      const container = document.getElementById('langSelectorContainer');
      container.innerHTML = '';

      LANGUAGES.forEach(lang => {
        const isSelected = lang.code === currentLang;
        const btn = document.createElement('button');
        btn.onclick = () => changeLanguage(lang.code);
        btn.className = `flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-extrabold transition-all duration-200 border ${
          isSelected 
            ? 'bg-teal-500 text-slate-950 border-teal-400 shadow-md shadow-teal-500/30 scale-105' 
            : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700 hover:border-slate-600'
        }`;
        
        btn.innerHTML = `
          <span class="text-sm">${lang.flag}</span>
          <span>${lang.native}</span>
        `;
        container.appendChild(btn);
      });
    }

    /* Change Active Language and Refresh UI */
    function changeLanguage(langCode) {
      currentLang = langCode;
      renderLanguageSelector();
      updateLanguageUI();

      // If speech recognition is running, update its language
      if (recognition) {
        recognition.lang = currentLang;
      }

      // If already viewing a destination result screen, refresh TTS & view text
      if (currentActiveDest) {
        showNavigationResult(currentActiveDest, false);
      }
    }

    /* Update All Static UI Labels Based on Current Selected Language */
    function updateLanguageUI() {
      // Subheader & Badges
      document.getElementById('subHeaderTitle').innerText = UI_STRINGS.subHeader[currentLang] || UI_STRINGS.subHeader['en-US'];
      document.getElementById('welcomeBadge').innerText = UI_STRINGS.welcomeBadge[currentLang] || UI_STRINGS.welcomeBadge['en-US'];
      document.getElementById('mainInstruction').innerText = UI_STRINGS.mainInstruction[currentLang] || UI_STRINGS.mainInstruction['en-US'];
      document.getElementById('voiceInstructionSub').innerText = UI_STRINGS.voiceInstructionSub[currentLang] || UI_STRINGS.voiceInstructionSub['en-US'];
      
      // Mic Button
      if (!isListening) {
        document.getElementById('micBtnText').innerText = UI_STRINGS.micBtnIdle[currentLang] || UI_STRINGS.micBtnIdle['en-US'];
      }
      document.getElementById('speechStatusText').innerText = UI_STRINGS.speechStatusDefault[currentLang] || UI_STRINGS.speechStatusDefault['en-US'];

      // Nav Screen Controls
      document.getElementById('btnReplayText').innerText = UI_STRINGS.replayBtn[currentLang] || UI_STRINGS.replayBtn['en-US'];
      document.getElementById('btnBackText').innerText = UI_STRINGS.backBtn[currentLang] || UI_STRINGS.backBtn['en-US'];
      document.getElementById('floorLineFollowInstruction').innerText = UI_STRINGS.followLineNotice[currentLang] || UI_STRINGS.followLineNotice['en-US'];

      // Destination Button Names & Hints in Grid
      for (const [key, dest] of Object.entries(DESTINATIONS)) {
        const nameEl = document.querySelector(`.dest-name-${key}`);
        if (nameEl) {
          nameEl.innerText = dest.names[currentLang] || dest.names['en-US'];
        }
        // Hints
        const hintEls = document.querySelectorAll(`.dest-dir-hint[data-dir="${dest.directionHints[currentLang]}"]`);
      }
    }


    /* ==========================================================================
       3. SPEECH RECOGNITION (STT) ENGINE FOR ANDROID & TABLET
       ========================================================================== */

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        console.warn('Web Speech API is not supported in this browser.');
        document.getElementById('speechStatusText').innerText = '⚠️ 음성 인식을 지원하지 않는 브라우저이거나 HTTPS 환경이 아닙니다.';
        return;
      }

      try {
        recognition = new SpeechRecognition();
        
        // 안드로이드 태블릿 최적화 옵션
        recognition.continuous = false;
        recognition.interimResults = true; // 인식 중 텍스트 실시간 반영 (안드로이드 시간초과 방지)
        recognition.lang = currentLang;

        recognition.onstart = function() {
          isListening = true;
          const micBtn = document.getElementById('micBtn');
          micBtn.classList.add('mic-active', 'from-red-600', 'to-rose-600');
          document.getElementById('micBtnText').innerText = UI_STRINGS.micBtnListening[currentLang] || UI_STRINGS.micBtnListening['en-US'];
          document.getElementById('speechStatusText').innerHTML = `<span class="text-rose-400 font-bold animate-pulse">● 말씀하세요! 음성을 듣고 있습니다...</span>`;
        };

        recognition.onresult = function(event) {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          transcript = transcript.toLowerCase().trim();
          console.log('Recognized speech:', transcript);
          document.getElementById('speechStatusText').innerText = `인식된 음성: "${transcript}"`;
          
          // 최종 결과일 때 검사실 찾기 진행
          if (event.results[0].isFinal) {
            matchSpeechToDestination(transcript);
          }
        };

        recognition.onerror = function(event) {
          console.error('Speech recognition error:', event.error);
          stopMicUI();
          
          let errorMsg = '음성 인식 중 오류가 발생했습니다.';
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            errorMsg = '❌ 마이크 권한이 없습니다. 브라우저 주소창 왼쪽 🔒 아이콘에서 마이크를 허용해주세요.';
          } else if (event.error === 'no-speech') {
            errorMsg = '⚠️ 음성이 감지되지 않았습니다. 마이크 버튼을 누른 후 바로 말씀해 보세요.';
          } else if (event.error === 'network') {
            errorMsg = '⚠️ 구글 음성 서비스 통신 오류 (인터넷/HTTPS 연결 확인 필요).';
          }
          
          document.getElementById('speechStatusText').innerText = errorMsg;
        };

        recognition.onend = function() {
          stopMicUI();
        };
      } catch (e) {
        console.error('Speech recognition init error:', e);
        document.getElementById('speechStatusText').innerText = '⚠️ 음성 인식 엔진 초기화 실패 (HTTPS 웹서버 환경이 필요합니다).';
      }
    }

    async function toggleSpeechRecognition() {
      // 1. 브라우저 지원 체크
      if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 브라우저 추천)');
        return;
      }

      if (isListening) {
        if (recognition) recognition.stop();
        stopMicUI();
        return;
      }

      // 2. 안드로이드 마이크 권한 강제 획득 처리 (최초 1회 권한 팝업 호출)
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // 권한 허용 후 스트림 즉시 해제 (recognition이 마이크 점유하도록)
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (err) {
        console.warn('Microphone permission request error:', err);
        alert('마이크 접근 권한이 필요합니다. 브라우저 설정에서 마이크 사용을 허용해 주세요.');
        document.getElementById('speechStatusText').innerText = '❌ 마이크 사용 허용이 필요합니다.';
        return;
      }

      // 3. 음성 인식 실행
      try {
        if (!recognition) {
          initSpeechRecognition();
        }
        recognition.lang = currentLang;
        recognition.start();
      } catch (err) {
        console.error('Speech Recognition Start Error:', err);
        // 이미 동작 중이거나 오류 시 재초기화 후 재시도
        initSpeechRecognition();
        try { recognition.start(); } catch(e){}
      }
    }

    function stopMicUI() {
      isListening = false;
      const micBtn = document.getElementById('micBtn');
      micBtn.classList.remove('mic-active', 'from-red-600', 'to-rose-600');
      document.getElementById('micBtnText').innerText = UI_STRINGS.micBtnIdle[currentLang] || UI_STRINGS.micBtnIdle['en-US'];
    }

    /* Keyword Search Engine for Voice Input Across Languages */
    function matchSpeechToDestination(spokenText) {
      let matchedKey = null;

      for (const [key, dest] of Object.entries(DESTINATIONS)) {
        // Check keywords
        const isMatched = dest.speechKeywords.some(kw => spokenText.includes(kw.toLowerCase()));
        // Check translated destination name
        const translatedName = (dest.names[currentLang] || '').toLowerCase();
        
        if (isMatched || spokenText.includes(translatedName)) {
          matchedKey = key;
          break;
        }
      }

      if (matchedKey) {
        selectDestination(matchedKey);
      } else {
        document.getElementById('speechStatusText').innerText = `❓ "${spokenText}" - 목적지를 찾을 수 없습니다. 다시 말씀해주세요.`;
      }
    }


    /* ==========================================================================
       4. NAVIGATION RESULT DISPLAY & TTS (SPEECH SYNTHESIS)
       ========================================================================== */

    function selectDestination(destId) {
      // Cancel ongoing speech or STT
      if (isListening && recognition) recognition.stop();
      window.speechSynthesis.cancel();

      currentActiveDest = DESTINATIONS[destId];
      if (!currentActiveDest) return;

      showNavigationResult(currentActiveDest, true);
    }

    function showNavigationResult(dest, shouldSpeak = true) {
      // Hide Main Screen, Show Nav Screen
      document.getElementById('mainScreen').classList.add('hidden');
      const navScreen = document.getElementById('navScreen');
      navScreen.classList.remove('hidden');

      // Update Nav Card Styling (Floor Line Color Theme)
      const navCard = document.getElementById('navCard');
      navCard.style.borderColor = dest.hexColor;
      navCard.style.boxShadow = `0 20px 40px -15px ${dest.hexColor}40`;

      // Icon & Color Tag
      const iconContainer = document.getElementById('navIconContainer');
      iconContainer.style.backgroundColor = `${dest.hexColor}30`;
      iconContainer.style.color = dest.hexColor;
      iconContainer.innerHTML = `<i class="fa-solid ${dest.icon}"></i>`;

      const lineTag = document.getElementById('navLineTag');
      lineTag.className = `px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider ${dest.tagBgClass}`;
      lineTag.innerText = dest.colorName.ko + ' (' + dest.colorName.en + ')';

      // Title
      document.getElementById('navDestTitle').innerText = dest.names[currentLang] || dest.names['en-US'];

      // Big Arrow with animation class
      const arrowBox = document.getElementById('navArrowBox');
      arrowBox.innerText = dest.arrow;
      arrowBox.className = `text-8xl sm:text-9xl mb-4 filter drop-shadow-lg ${dest.directionAnimClass}`;

      // Floor Line Graphic
      const lineBar = document.getElementById('floorLineBar');
      lineBar.style.backgroundColor = dest.hexColor;
      lineBar.style.boxShadow = `0 0 20px ${dest.hexColor}`;

      // Target Language Label & Texts
      const targetLangObj = LANGUAGES.find(l => l.code === currentLang) || LANGUAGES[0];
      document.getElementById('targetLangLabel').innerText = `${targetLangObj.flag} ${targetLangObj.native} GUIDANCE`;

      const targetText = dest.guides[currentLang] || dest.guides['en-US'];
      const koreanText = dest.guides['ko-KR'];

      document.getElementById('navTargetGuide').innerText = targetText;
      document.getElementById('navKoreanGuide').innerText = koreanText;

      // Speak TTS if requested
      if (shouldSpeak) {
        speakCurrentGuide();
      }
    }

    /* Web Speech Synthesis (TTS) Reader */
    function speakCurrentGuide() {
      if (!currentActiveDest) return;

      window.speechSynthesis.cancel(); // Stop any active audio

      const textToSpeak = currentActiveDest.guides[currentLang] || currentActiveDest.guides['en-US'];
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      
      utterance.lang = currentLang;
      utterance.rate = 0.85; // Slightly slower speed for foreign patients & elderly clarity
      utterance.pitch = 1.0;

      // Browser TTS fallback logic
      window.speechSynthesis.speak(utterance);
    }

    /* Return to Main Home Screen */
    function goToHome() {
      // Cancel TTS Audio
      window.speechSynthesis.cancel();
      if (isListening && recognition) recognition.stop();

      currentActiveDest = null;
      document.getElementById('navScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');

      // Reset Mic status text
      updateLanguageUI();
    }
  </script>
</body>
